adapter_lynx:
    ros__parameters:
        # Network configuration
        robot_ip: "10.21.31.103"
        robot_port: 30000
        # local_port: 0   # 0 = OS-assigned; set to e.g. 30001 to bind a fixed port

        # Heartbeat interval (docs recommend >= 1 Hz)
        heartbeat_interval_sec: 1.0

        # UDP receive timeout (used internally to allow clean shutdown)
        recv_timeout_sec: 1.0

        # ROS cmd_vel safety limits (m/s for linear, rad/s for angular)
        max_linear_x: 2.0
        max_linear_y: 2.0
        max_angular_z: 2.0

        # Lynx Command=21 uses normalized axis ratios in [-1, 1].
        # Convert with: axis ratio = limited SI velocity / full-scale SI velocity.
        # The confirmed maximum linear speed is 2 m/s; keep yaw independently tunable.
        lynx_full_scale_linear_x_mps: 2.0
        lynx_full_scale_linear_y_mps: 2.0
        lynx_full_scale_angular_z_radps: 2.0

        # Backward-compatible startup state. Keep regular + standing unless the
        # deployment explicitly wants navigation absolute-velocity control.
        # initial_mode: 0=regular, 1=navigation, 2=assisted
        # initial_motion_state: 1=standing, 17=RL control
        initial_mode: 0
        initial_motion_state: 1

        # cmd_vel watchdog: send zero velocity if no cmd_vel arrives within this period
        cmd_vel_timeout_ms: 500
        watchdog_check_interval_ms: 100

        # Query service timeout: wait for matching UDP response before returning
        query_timeout_ms: 100

        # Mode, motion-state and gait actions wait for BasicStatus confirmation.
        # Keep this below robot_switch_server call_timeout_ms (default 2000 ms).
        control_transition_timeout_ms: 1500

        # Status push is 2 Hz on Lynx. Allow several periods for initial connect readiness.
        connect_status_timeout_ms: 2000

        # Health/system_info consider status stale after this interval.
        status_stale_timeout_ms: 2000
