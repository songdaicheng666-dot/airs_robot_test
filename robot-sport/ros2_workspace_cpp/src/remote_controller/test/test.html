<!DOCTYPE html>
<html>
<head>
    <title>Velocity Controller</title>
    <script>
        function sendVelocityCommand() {
            const linear_x = parseFloat(document.getElementById('linear_x').value);
            const angular_z = parseFloat(document.getElementById('angular_z').value);
            
            const ws = new WebSocket("ws://localhost:9090");
            
            ws.onopen = function() {
                const command = JSON.stringify({
                    linear_x: linear_x,
                    angular_z: angular_z
                });
                ws.send(command);
            };
            
            ws.onmessage = function(event) {
                const response = JSON.parse(event.data);
                if (response.success) {
                    alert("Command executed successfully!");
                } else {
                    alert(`Error: ${response.error}`);
                }
                ws.close();
            };
            
            ws.onerror = function(error) {
                console.error("WebSocket Error: ", error);
                alert("Connection error");
            };
        }
    </script>
</head>
<body>
    <h1>Robot Velocity Controller</h1>
    
    <label for="linear_x">Linear Velocity (m/s):</label>
    <input type="number" id="linear_x" step="0.1" value="0.5">
    
    <br>
    
    <label for="angular_z">Angular Velocity (rad/s):</label>
    <input type="number" id="angular_z" step="0.1" value="0.3">
    
    <br><br>
    
    <button onclick="sendVelocityCommand()">Send Command</button>
</body>
</html>
