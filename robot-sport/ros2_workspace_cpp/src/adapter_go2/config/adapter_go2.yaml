adapter_go2:
    ros__parameters:
        # Network configuration
        network_interface: "eth0"
        sdk_timeout_sec: 10.0

        # Behavior configuration
        auto_stand_on_connect: true
        stand_down_on_disconnect: false

        # Velocity limits (m/s for linear, rad/s for angular)
        max_linear_x: 3.0
        max_linear_y: 3.0
        max_angular_z: 2.0

        # cmd_vel watchdog: StopMove if no cmd_vel received within this period
        cmd_vel_timeout_ms: 500
        watchdog_check_interval_ms: 100

        # safe_stop action: "stop_move", "stop_and_sit", or "damp"
        safe_stop_action: "stop_move"

        # Keep this below robot_switch_server.call_timeout_ms unless that timeout is raised too.
        connect_state_timeout_ms: 1000

        # Health/system_info consider sport_state stale after this interval.
        state_stale_timeout_ms: 2000
