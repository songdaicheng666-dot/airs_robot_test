adapter_fake:
  ros__parameters:
    # Behavior mode: normal, exit_immediately, connect_fail,
    #   disconnect_hang, safe_stop_fail, delayed_sigterm, fork_child
    behavior_mode: "normal"

    # For exit_immediately mode: delay before _exit(42)
    exit_delay_ms: 500

    # For disconnect_hang mode: how long disconnect blocks
    disconnect_hang_ms: 10000

    # For delayed_sigterm mode: delay before exit on SIGTERM
    sigterm_delay_ms: 5000
